{% extends "base.html" %}

{% block title %}PPAI Society Awards — Plant Protection Association of India{% endblock %}

{% block extra_css %}
<style>
  /* ===================================================================
     PPAI SOCIETY AWARDS - MODERN SPLIT-PANEL INTERACTIVE PORTAL
  =================================================================== */
  .awards-page-section {
    min-height: calc(100vh - 70px);
    box-sizing: border-box;
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(24px, 3vh, 36px) clamp(20px, 3.5vw, 48px) clamp(70px, 9vh, 110px) clamp(20px, 3.5vw, 48px);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .awards-page-titlebar {
    margin-bottom: clamp(16px, 2.2vh, 22px);
  }

  .awards-page-titlebar h1 {
    font-size: clamp(22px, 1.8vw, 28px);
    font-weight: 800;
    color: var(--deep-forest);
    margin: 0;
    letter-spacing: -0.02em;
  }

  /* Main Split-Panel Card */
  .awards-portal-container {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(11, 36, 23, 0.05);
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 640px;
    overflow: hidden;
  }

  /* Left Sidebar: Categories List */
  .awards-sidebar {
    background: #fbfdfc;
    border-right: 1px solid #e2ece5;
    display: flex;
    flex-direction: column;
  }

  .award-nav-item {
    padding: 16px 20px;
    border-bottom: 1px solid #eef4f0;
    cursor: pointer;
    position: relative;
    transition: all 0.18s ease;
    background: transparent;
    text-align: left;
    border-left: 4px solid transparent;
  }

  .award-nav-item:hover {
    background: #f2f8f4;
  }

  .award-nav-item.active {
    background: #eef7f1;
    border-left-color: var(--vibrant-green);
  }

  .award-nav-title {
    font-size: clamp(13.5px, 0.92vw, 15px);
    font-weight: 700;
    color: var(--deep-forest);
    margin: 0 0 4px 0;
    line-height: 1.35;
  }

  .award-nav-count {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    margin: 0;
  }

  /* Right Panel: Content Area */
  .awards-content-panel {
    padding: clamp(24px, 3vw, 36px);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    background: #ffffff;
  }

  .panel-header-title {
    font-size: clamp(18px, 1.4vw, 22px);
    font-weight: 800;
    color: var(--deep-forest);
    margin: 0 0 6px 0;
    line-height: 1.3;
  }

  .panel-header-desc {
    font-size: clamp(12.5px, 0.88vw, 14px);
    color: var(--text-muted);
    margin: 0 0 clamp(18px, 2.4vh, 24px) 0;
    line-height: 1.5;
  }

  /* Controls: Search & Period Filter Pills */
  .awards-controls-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: clamp(14px, 1.8vh, 18px);
  }

  .search-input-box {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-input-box input {
    width: 100%;
    padding: 8px 14px 8px 34px;
    font-size: 13px;
    border: 1px solid #d0e2d6;
    border-radius: 20px;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
    font-family: inherit;
    background: #fafdfb;
  }

  .search-input-box input:focus {
    border-color: var(--vibrant-green);
    background: #ffffff;
  }

  .search-input-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #8da396;
    pointer-events: none;
  }

  .period-filter-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-pill {
    background: #ffffff;
    border: 1px solid #c8ded0;
    border-radius: 18px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #245638;
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: inherit;
  }

  .filter-pill:hover {
    background: #eef7f1;
    border-color: var(--vibrant-green);
  }

  .filter-pill.active {
    background: #175434;
    border-color: #175434;
    color: #ffffff;
  }

  .awardees-counter {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 0 0 12px 0;
    font-weight: 600;
  }

  /* Awardees List Container (Scrollable) */
  .awardees-list-container {
    border: 1px solid #e1eee6;
    border-radius: 10px;
    overflow-y: auto;
    max-height: 520px;
    background: #ffffff;
  }

  .awardee-row-item {
    display: grid;
    grid-template-columns: 140px 1fr;
    padding: 13px 18px;
    border-bottom: 1px solid #eef4f0;
    align-items: center;
    transition: background-color 0.15s ease;
  }

  .awardee-row-item:last-child {
    border-bottom: none;
  }

  .awardee-row-item:hover {
    background: #f7fbf8;
  }

  .awardee-year {
    font-weight: 800;
    color: var(--vibrant-green);
    font-size: 13.5px;
  }

  .awardee-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--deep-forest);
    line-height: 1.45;
  }

  .awardee-details {
    font-size: 12px;
    color: #55695e;
    font-weight: 400;
    margin-top: 2px;
  }

  .no-data-notice {
    padding: 36px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    border: 1px dashed #d5e5db;
    border-radius: 10px;
  }

  /* Responsive Media Queries */
  @media (max-width: 900px) {
    .awards-portal-container {
      grid-template-columns: 1fr;
    }
    .awards-sidebar {
      border-right: none;
      border-bottom: 1px solid #e2ece5;
      max-height: 240px;
      overflow-y: auto;
    }
  }

  @media (max-width: 600px) {
    .awardee-row-item {
      grid-template-columns: 1fr;
      gap: 4px;
    }
    .awards-controls-bar {
      flex-direction: column;
      align-items: stretch;
    }
    .awards-content-panel {
      padding: 18px 14px;
    }
  }
</style>
{% endblock %}

</section>

        { year: "2023", name: "Dr Srikanth Rupavathara", details: "Best Scientist Award — Digital Agriculture" }
      ]
    },
    {
      id: "recognition-awards",
      title: "PPAI Recognition & Distinction Awards",
      desc: "Conferred during Golden Jubilee ICPHM 2023 for Lifetime Contribution, Outstanding Services, and National Agricultural Leadership (1972–2022).",
      awardees: [
        { year: "1972–22", name: "Dr Dodla V Raghava Reddy, Dr V Raghunathan, Dr P S Chandurkar, Dr K S Varaprasad, Dr K Krishnaiah, Dr KSRK Murthy, Dr B Sarath Babu", details: "Lifetime Contribution Award" },
        { year: "1972–22", name: "Dr M Veera Bhadra Rao, Dr B Julius Divakar, Dr T B Gour, Dr Rajan Sharma, Dr T Ramesh Babu, Dr Anitha Kodaru", details: "Outstanding Contribution Award" },
        { year: "1972–22", name: "Dr B Govinda Naik, Dr Renu Sharma, Dr S K Chakrabarty, Dr R Jagadeeshwar, Dr B Parameswari, Dr R K Khetarpal, Dr Harvir Singh, Dr Gururaj Katti, Dr A Raja Reddy, Dr V Celia Chalam, Dr M Srinivas Prasad, Dr H C Sharma, Dr L Saravanan, Dr K M Azam, Dr S Sithanantham, Dr C Pramod Chandra Kumar, Dr G Sreedevi, Dr Prasanna Holajjer, Dr Bhaskar Bajaru", details: "Golden Jubilee Recognition Award" },
        { year: "1972–22", name: "Dr S N Puri, Dr C D Mayee, Dr Chelliah, Dr Anupam Varma, Dr A K Dhawan, Dr A N Mukhopadhyay, Dr Srikant Kulkarni, Dr J S Prasad, Dr H S Gaur", details: "PPAI Award of Distinction" },
        { year: "1972–22", name: "Dr S N Sushil, Dr J P Singh", details: "PPAI Golden Jubilee Special Award" },
        { year: "1972–22", name: "Mr Vinod Kumar Samanthula", details: "PPAI Posthumous Award" }
      ]
    }
  ];

  let currentCategoryIndex = 0;
  let currentPeriodFilter = "all";
  let searchQuery = "";

  const sidebarEl = document.getElementById("awardsSidebar");
  const titleEl = document.getElementById("panelAwardTitle");
  const descEl = document.getElementById("panelAwardDesc");
  const counterEl = document.getElementById("awardeesCounter");
  const listContainerEl = document.getElementById("awardeesListContainer");
  const searchInput = document.getElementById("awardeeSearch");
  const filterPills = document.querySelectorAll(".filter-pill");

  function renderSidebar() {
    sidebarEl.innerHTML = awardsDataset.map((cat, idx) => `
      <div class="award-nav-item ${idx === currentCategoryIndex ? 'active' : ''}" data-index="${idx}">
        <h3 class="award-nav-title">${cat.title}</h3>
        <p class="award-nav-count">${cat.awardees.length} awardee${cat.awardees.length === 1 ? '' : 's'}</p>
      </div>
    `).join('');

    sidebarEl.querySelectorAll(".award-nav-item").forEach(item => {
      item.addEventListener("click", () => {
        currentCategoryIndex = parseInt(item.dataset.index);
        searchQuery = "";
        searchInput.value = "";
        currentPeriodFilter = "all";
        updatePillsState();
        renderSidebar();
        renderContent();
      });
    });
  }

  function updatePillsState() {
    filterPills.forEach(pill => {
      pill.classList.toggle("active", pill.dataset.period === currentPeriodFilter);
    });
  }

  function matchesPeriod(yearStr, period) {
    if (period === "all") return true;
    
    // Extract numbers from yearStr like "1986–88", "1997", "2012", "Before 2003", "2017–23"
    const numbers = yearStr.match(/\d{4}/g);
    let startYear = 1970;
    if (numbers && numbers.length > 0) {
      startYear = parseInt(numbers[0]);
    } else if (yearStr.toLowerCase().includes("before 2003")) {
      startYear = 1990;
    }

    if (period === "pre-2000") return startYear <= 2000;
    if (period === "2001-2010") return startYear >= 2001 && startYear <= 2010;
    if (period === "2011-2023") return startYear >= 2011;
    return true;
  }

  function renderContent() {
    const category = awardsDataset[currentCategoryIndex];
    titleEl.textContent = category.title;
    descEl.textContent = category.desc;

    let filtered = category.awardees.filter(item => {
      const matchSearch = searchQuery === "" || 
        item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        item.details.toLowerCase().includes(searchQuery.toLowerCase()) ||
        item.year.toLowerCase().includes(searchQuery.toLowerCase());
      
      const matchPeriod = matchesPeriod(item.year, currentPeriodFilter);
      return matchSearch && matchPeriod;
    });

    counterEl.textContent = `${filtered.length} of ${category.awardees.length} awardees`;

    if (filtered.length === 0) {
      listContainerEl.innerHTML = `
        <div class="no-data-notice">
          No awardees found matching "${searchQuery || currentPeriodFilter}".
        </div>
      `;
    } else {
      listContainerEl.innerHTML = filtered.map(item => `
        <div class="awardee-row-item">
          <div class="awardee-year">${item.year}</div>
          <div>
            <div class="awardee-name">${item.name}</div>
            <div class="awardee-details">${item.details}</div>
          </div>
        </div>
      `).join('');
    }
  }

  // Filter Pill clicks
  filterPills.forEach(pill => {
    pill.addEventListener("click", () => {
      currentPeriodFilter = pill.dataset.period;
      updatePillsState();
      renderContent();
    });
  });

  // Search input
  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value.trim();
    renderContent();
  });

  // Init
  renderSidebar();
  renderContent();
</script>
{% endblock %}
