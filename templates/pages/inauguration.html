{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inauguration — Plant Protection Association of India (PPAI)</title>

  <!-- Plus Jakarta Sans Font (Primary Typography Across Entire PPAI Website) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, #FFFFFF 0%, #E1F0E8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 4vw, 36px);
      color: #1D2924;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Clean Center Stage Card (Distraction-Free, Human Designer Proportions) */
    .ceremony-card {
      background: #FFFFFF;
      border: 1px solid rgba(11, 36, 23, 0.08);
      border-radius: 24px;
      box-shadow: 0 16px 44px rgba(11, 36, 23, 0.07);
      max-width: 500px;
      width: 100%;
      padding: clamp(38px, 5vw, 50px) clamp(24px, 4vw, 40px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Golden Jubilee Emblem */
    .ceremony-emblem {
      width: clamp(96px, 9vw, 116px);
      height: auto;
      margin-bottom: 22px;
      display: block;
    }

    /* PPAI Full Form (Main Title) */
    .ceremony-title {
      font-size: clamp(21px, 2.3vw, 25px);
      font-weight: 800;
      color: #0B2417;
      line-height: 1.3;
      letter-spacing: -0.025em;
      margin-bottom: 10px;
    }

    /* Tagline */
    .ceremony-tagline {
      font-size: clamp(13px, 1.05vw, 14.5px);
      font-weight: 600;
      color: #B7791F;
      line-height: 1.45;
      margin-bottom: 30px;
      max-width: 420px;
    }

    /* Clean, Human-Designed "Inaugurate" Button */
    .btn-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 44px;
      border-radius: 100px;
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 700;
      color: #FFFFFF;
      background: #00B272;
      border: none;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 178, 114, 0.28);
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-open:hover {
      background: #00965F;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0, 178, 114, 0.38);
      color: #FFFFFF;
    }

    .btn-open:active {
      transform: translateY(0);
      box-shadow: 0 3px 10px rgba(0, 178, 114, 0.25);
    }

    .btn-arrow {
      font-size: 16px;
      transition: transform 0.2s ease;
    }

    .btn-open:hover .btn-arrow {
      transform: translateX(3px);
    }

    /* Since 1972 Heritage Note (Under the Button) */
    .ceremony-since {
      margin-top: 22px;
      font-size: 12.5px;
      font-weight: 600;
      color: #64746D;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <main class="ceremony-card">
    <!-- Golden Jubilee Emblem -->
    <img src="{% static 'images/golden_jubilee_emblem.png' %}?v=20261009_logo_old" alt="PPAI Golden Jubilee" class="ceremony-emblem">

    <!-- Full Institution Name -->
    <h1 class="ceremony-title">Plant Protection Association of India</h1>

    <!-- Official Tagline -->
    <p class="ceremony-tagline">Advancing Science, Safeguarding Crops, Sustaining Agriculture</p>

    <!-- Clean Direct Inauguration Button -->
    <a href="{% url 'home' %}?launch=1" class="btn-open">
      <span>Inaugurate</span>
      <span class="btn-arrow">&rarr;</span>
    </a>

    <!-- Heritage Note Under the Button -->
    <div class="ceremony-since">Since 1972</div>
  </main>

</body>
</html>
