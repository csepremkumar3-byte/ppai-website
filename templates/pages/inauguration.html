{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inauguration — Plant Protection Association of India (PPAI)</title>

  <!-- Plus Jakarta Sans Font (Design System Standard) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, #FFFFFF 0%, #E1F0E8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3.5vw, 32px);
      color: #1D2924;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Clean Center Stage Card (Human Proportions, Balanced Spacing) */
    .ceremony-card {
      background: #FFFFFF;
      border: 1px solid rgba(11, 36, 23, 0.08);
      border-radius: 24px;
      box-shadow: 0 18px 48px rgba(11, 36, 23, 0.06);
      max-width: 620px;
      width: 100%;
      padding: clamp(38px, 5vw, 52px) clamp(20px, 4vw, 40px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Enhanced Golden Jubilee Emblem (Crisp, High Visibility) */
    .ceremony-emblem {
      width: clamp(135px, 15vw, 170px);
      height: auto;
      margin-bottom: 22px;
      display: block;
      filter: drop-shadow(0 4px 14px rgba(11, 36, 23, 0.06));
    }

    /* Institution Primary Title (Prominent, Authoritative, Single Line) */
    .ceremony-title {
      font-size: clamp(17px, 2.3vw, 23px);
      font-weight: 800;
      color: #0B2417;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      white-space: nowrap;
      max-width: 100%;
    }

    /* Tagline (Delicate, Subordinate to PPAI, Single Line) */
    .ceremony-tagline {
      font-size: clamp(10.5px, 1.15vw, 12px);
      font-weight: 500;
      color: #9A6A1D;
      line-height: 1.4;
      letter-spacing: 0.03em;
      margin-bottom: 34px;
      white-space: nowrap;
      max-width: 100%;
    }

    /* Clean, Human-Designed "Inaugurate" Button */
    .btn-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 42px;
      border-radius: 100px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      background: #00B272;
      border: none;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 178, 114, 0.28);
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-open:hover {
      background: #00965F;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0, 178, 114, 0.36);
      color: #FFFFFF;
    }

    .btn-open:active {
      transform: translateY(0);
      box-shadow: 0 3px 10px rgba(0, 178, 114, 0.25);
    }

    .btn-arrow {
      font-size: 15px;
      transition: transform 0.2s ease;
    }

    .btn-open:hover .btn-arrow {
      transform: translateX(3px);
    }

    /* Heritage Note (Under the Button) */
    .ceremony-since {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #718096;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .ceremony-title,
      .ceremony-tagline {
        white-space: normal;
      }
    }
  </style>
</head>
<body>

  <main class="ceremony-card">
    <!-- Golden Jubilee Emblem -->
    <img src="{% static 'images/golden_jubilee_emblem.png' %}?v=20261009_logo_old" alt="PPAI Golden Jubilee" class="ceremony-emblem">

    <!-- Full Institution Name (Single Line) -->
    <h1 class="ceremony-title">Plant Protection Association of India</h1>

    <!-- Official Tagline (Small Under PPAI, Single Line) -->
    <p class="ceremony-tagline">Advancing Science, Safeguarding Crops, Sustaining Agriculture</p>

    <!-- Clean Direct Inauguration Button -->
    <a href="{% url 'home' %}?launch=1" class="btn-open">
      <span>Inaugurate</span>
      <span class="btn-arrow">&rarr;</span>
    </a>

    <!-- Heritage Note Under the Button -->
    <div class="ceremony-since">Since 1972</div>
  </main>

</body>
</html>
