{% extends "base.html" %}

{% block title %}Legends of PPAI — Plant Protection Association of India{% endblock %}

{% block extra_css %}
<style>
  /* ===================================================================
     LEGENDS OF PPAI - EXECUTIVE COUNCIL MEMBERS (1972 - 2023)
  =================================================================== */
  .legends-section {
    min-height: calc(100vh - 70px);
    box-sizing: border-box;
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(24px, 3vh, 36px) clamp(24px, 4vw, 56px) clamp(70px, 9vh, 110px) clamp(24px, 4vw, 56px);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .legends-titlebar {
    margin-bottom: 0;
  }

  .legends-titlebar h1 {
    font-size: clamp(22px, 1.8vw, 28px);
    font-weight: 800;
    color: var(--deep-forest);
    margin: 0;
    letter-spacing: -0.02em;
  }

  /* Main Interactive Card Box */
  .council-history-card {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(11, 36, 23, 0.05);
    padding: clamp(22px, 2.8vw, 34px);
    box-sizing: border-box;
    width: 100%;
    margin-bottom: clamp(28px, 3.5vh, 36px);
  }

  /* Period Buttons Grid */
  .period-buttons-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(8px, 1vw, 12px);
    margin-top: clamp(18px, 2.4vh, 26px);
    margin-bottom: 0;
  }

  .period-btn {
    appearance: none;
    background: #ffffff;
    border: 1.5px solid #246845;
    border-radius: 8px;
    padding: 11px 6px;
    font-size: clamp(12px, 0.86vw, 13.5px);
    font-weight: 700;
    color: #174e30;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
    white-space: nowrap;
  }

  .period-btn:hover {
    background: rgba(0, 178, 114, 0.12);
    border-color: #185a36;
    color: #0d3820;
  }

  .period-btn.active {
    background: #175434;
    border-color: #175434;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(23, 84, 52, 0.25);
  }

  /* Table Box - Hidden by default until hovered */
  .history-table-box {
    display: none;
    border: 1.5px solid #246845;
    border-radius: 10px;
    overflow: hidden;
    background: #ffffff;
    margin-top: clamp(22px, 2.8vh, 30px);
    animation: fadeIn 0.2s ease-in-out;
  }

  .history-table-box.is-visible {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .history-table-title {
    font-size: clamp(15px, 1.1vw, 17px);
    font-weight: 800;
    color: #0f3821;
    padding: 14px 20px;
    margin: 0;
    border-bottom: 1px solid rgba(36, 104, 69, 0.2);
    background: #ffffff;
  }

  .council-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: clamp(12.5px, 0.88vw, 14px);
  }

  .council-table thead th {
    background: #eaf3ec;
    color: #0f3821;
    font-weight: 800;
    padding: 12px 20px;
    border-bottom: 1px solid #d1e2d6;
    letter-spacing: 0.01em;
  }

  .council-table thead th:first-child {
    width: 28%;
    min-width: 180px;
  }

  .council-table thead th:last-child {
    width: 72%;
  }

  .council-table tbody tr {
    border-bottom: 1px solid #edf4ef;
    transition: background 0.15s ease;
  }

  .council-table tbody tr:last-child {
    border-bottom: none;
  }

  .council-table tbody tr:hover {
    background: rgba(0, 178, 114, 0.03);
  }

  .council-table td {
    padding: 12px 20px;
    vertical-align: middle;
    line-height: 1.55;
  }

  .position-cell {
    font-weight: 800;
    color: #0f3821;
    white-space: nowrap;
  }

  .name-cell {
    color: #2b3b33;
    font-weight: 500;
  }

  /* Responsive Breakpoints */
  @media (max-width: 1100px) {
    .period-buttons-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  @media (max-width: 768px) {
    .period-buttons-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .council-table thead th:first-child {
      width: 35%;
      min-width: 140px;
    }
  }

  @media (max-width: 520px) {
    .period-buttons-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .council-history-card {
      padding: 16px 12px;
    }
    .council-table td, .council-table thead th {
      padding: 10px 12px;
    }
    .position-cell {
      white-space: normal;
    }
  }
</style>
{% endblock %}

  const periods = Object.keys(councilData);
  const buttonsContainer = document.getElementById('periodButtons');
  const cardEl = document.getElementById('councilHistoryCard');
  const tableBoxEl = document.getElementById('historyTableBox');
  const titleEl = document.getElementById('historyTableTitle');
  const tbodyEl = document.getElementById('councilTableBody');

  let currentSelectedPeriod = null;

  function handlePeriodClick(period) {
    // If clicking the currently open period, toggle it closed
    if (currentSelectedPeriod === period) {
      currentSelectedPeriod = null;
      tableBoxEl.classList.remove('is-visible');
      document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
      return;
    }

    // Otherwise show the clicked period details and keep it visible until changed
    currentSelectedPeriod = period;
    titleEl.textContent = 'Executive Council ' + period;
    const rows = councilData[period] || [];
    tbodyEl.innerHTML = rows.map(r => `
      <tr>
        <td class="position-cell">${r.position}</td>
        <td class="name-cell">${r.name}</td>
      </tr>
    `).join('');

    tableBoxEl.classList.add('is-visible');

    // Highlight only the clicked button
    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.period === period);
    });
  }

  // Create buttons with click handler
  periods.forEach((period) => {
    const btn = document.createElement('button');
    btn.className = 'period-btn';
    btn.textContent = period;
    btn.dataset.period = period;

    btn.addEventListener('click', () => handlePeriodClick(period));

    buttonsContainer.appendChild(btn);
  });
</script>
